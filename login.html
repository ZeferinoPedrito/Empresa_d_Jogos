<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | NowStation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-login">
  <main class="login">
    <h1 class="login-logo">NowStation</h1>

    <form class="login-form" action="index.html">
      <h2>Entrar</h2>

      <label for="usuario">Utilizador</label>
      <input type="text" id="usuario" autocomplete="username">

      <label for="senha">Palavra-passe</label>
      <input type="password" id="senha" autocomplete="current-password">

      <button type="submit" class="botao">Entrar</button>
    </form>
  </main>
</body>
</html>
